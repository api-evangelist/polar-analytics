apis:
- name: Polar Headless MCP
  description: >-
    Hosted Model Context Protocol server that doubles as Polar's HTTP API surface;
    invoke tools at POST https://api.polaranalytics.com/mcp/tool/<tool_name> with a
    Bearer API key. Exposes 8 tools for generating ecommerce analytics reports,
    dashboards, dimensions, and shareable deep links.
  humanURL: https://intercom.help/polar-app/en/articles/12960325-using-mcp-tools-as-an-api
  baseURL: https://api.polaranalytics.com
  properties:
  - type: MCPServer
    url: mcp/polar-analytics-mcp.yml
  - type: Authentication
    url: authentication/polar-analytics-authentication.yml
  - type: APIReference
    url: https://intercom.help/polar-app/en/articles/12960325-using-mcp-tools-as-an-api
- name: Polar Pixel
  description: >-
    First-party, server-side tracking pixel that captures the ecommerce customer
    journey from the merchant's own domain and builds a graph-based Lifetime ID.
    Client events are reported via the @polar-analytics/pixel-sdk to the pixel
    ingestion endpoint at pixel-api.polaranalytics.com.
  humanURL: https://www.polaranalytics.com/features/polar-pixel-and-lifetime-id
  baseURL: https://pixel-api.polaranalytics.com
  properties:
  - type: SDKs
    url: packages/polar-analytics-packages.yml
  - type: Documentation
    url: https://intercom.help/polar-app/en/articles/6752194-using-the-polar-pixel-complete-installation-tracking-setup-guide
